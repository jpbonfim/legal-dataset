# Default configuration for the legislation dataset pipeline.
# To change values, create a TOML file with only those values and pass it with
# `--config path/to/file.toml`; it is applied on top of this file.

[paths]
data_dir = "data"

[catalog]
# Kinds of norms to collect (LexML URN names).
norm_kinds = [
    "constituicao",
    "emenda.constitucional",
    "lei.complementar",
    "lei",
    "decreto.lei",
    "medida.provisoria",
    "decreto",
]
first_year = 1889
last_year = 0  # 0 = current year

# Which final dataset (Parquet folder) each norm kind goes to.
[subsets]
leis = [
    "constituicao",
    "emenda.constitucional",
    "lei.complementar",
    "lei",
    "decreto.lei",
    "medida.provisoria",
]
decretos = ["decreto"]

[sources]
catalog = "senado"
# Consulted in order. Each one contributes legal status and/or text location.
locators = ["normas_leg", "senado_status", "planalto"]

[http]
# Identifies the client honestly, in the usual crawler format ("Mozilla/5.0 (compatible; ...)").
# The Planalto drops connections from User-Agents that do not start with "Mozilla/5.0".
# Add a contact URL/e-mail in `contact` if you want site operators to be able to reach you;
# it is appended to the User-Agent.
user_agent = "Mozilla/5.0 (compatible; legis-dataset/0.1; research dataset builder)"
contact = ""
timeout_seconds = 60
max_attempts = 5
backoff_base_seconds = 2.0
backoff_max_seconds = 120.0

[http.circuit_breaker]
failure_threshold = 5
cooldown_seconds = 300

# Per-host limits. Different hosts are crawled in parallel.
# - rate_per_second: average rate; it is halved automatically on 429/5xx/timeouts and
#   recovers gradually.
# - jitter: each gap between requests is drawn from (1 ± jitter) × the average gap, so the
#   traffic does not have the evenly spaced rhythm of a bot (the average is unchanged).
# - max_concurrency: requests open at the same time; it only matters when responses take
#   longer than the gap between requests.
[http.default_host]
rate_per_second = 1.0
max_concurrency = 1
jitter = 0.5

[http.hosts."legis.senado.leg.br"]
rate_per_second = 3.0
max_concurrency = 3
jitter = 0.5

[http.hosts."normas.leg.br"]
rate_per_second = 3.0
max_concurrency = 3
jitter = 0.5

[http.hosts."www.planalto.gov.br"]
rate_per_second = 2.0
max_concurrency = 3
jitter = 0.5

[processing]
parse_workers = 0          # 0 = number of CPUs
min_chars = 200            # documents shorter than this are dropped
near_duplicate_threshold = 0.9
minhash_permutations = 128

[export]
max_rows_per_shard = 20000
compression = "zstd"

[stats]
# Hugging Face tokenizer used to count tokens. Use the tokenizer of the model you will train.
tokenizer = "Qwen/Qwen2.5-7B"
