services:
  legis-dataset:
    build: .
    image: legis-dataset
    volumes:
      - ./data:/app/data
    # Interactive terminal so the live progress panel renders and Ctrl+C stops cleanly.
    tty: true
    stdin_open: true
    init: true
    # Keep files in ./data owned by the host user (export UID/GID if your shell does not).
    user: "${UID:-1000}:${GID:-1000}"
    # Default (used by `docker compose up`): full pipeline. `up` passes output through line by
    # line, which garbles a panel redrawn in place, so progress is printed as plain lines.
    # `docker compose run --rm legis-dataset run` keeps the live panel.
    command: ["run", "--progress", "plain"]
